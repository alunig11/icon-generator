<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Generator | v1.0</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: "Google Sans", "Open Sans", "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
      font-family: var(--font-main);
      color: #1c1e21;
      padding: 15px;
    }

    .tool-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      width: 100%;
      max-width: 450px;
    }

    .section-title {
      font-weight: 700;
      color: #003087;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.5px;
    }

    .form-label {
      font-weight: 700;
      color: #5f6368;
      font-size: 0.75rem;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #dadce0;
      font-size: 0.95rem;
      font-family: var(--font-main);
    }

    .icon-preview-box {
      background-color: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      border-style: dashed;
    }

    #preview {
      width: 128px;
      height: 128px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: var(--font-main);
      font-weight: 500;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      border-radius: 24px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background-color: #1a73e8;
      border: none;
      padding: 12px;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: #174ea6;
    }

    .color-input-wrapper {
      width: 45px;
      height: 45px;
      padding: 0;
      border: none;
      overflow: hidden;
      border-radius: 50%;
      cursor: pointer;
    }

    #color {
      border: none;
      width: 150%;
      height: 150%;
      margin: -25%;
      cursor: pointer;
    }

    .input-group-text {
      background-color: #f1f3f4;
      border-color: #dadce0;
      color: #5f6368;
    }
  </style>
</head>
<body>

  <div class="tool-card">
    <h4 class="section-title"><i class="fa-solid fa-circle-dot me-2"></i> Icon Generator</h4>

    <div class="mb-4">
      <label class="form-label">Reference Name</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa-solid fa-signature"></i></span>
        <input type="text" id="text" class="form-control" placeholder="e.g. Google, GOMO" maxlength="15">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Accent Color</label>
      <div class="d-flex align-items-center gap-3">
        <div class="color-input-wrapper shadow-sm border">
          <input type="color" id="color" value="#1a73e8">
        </div>
        <input type="text" id="hexText" class="form-control" value="#1A73E8" readonly style="background: #f1f3f4; width: 110px; font-weight: 500;">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Icon Preview</label>
      <div class="icon-preview-box">
        <div id="preview">Ab</div>
        <div class="text-muted small mt-3" style="font-weight: 500;">128x128 Adaptive Asset</div>
      </div>
    </div>

    <button id="download" class="btn btn-primary w-100">
      <i class="fa-solid fa-cloud-arrow-down me-2"></i> Export PNG
    </button>
  </div>

  <script>
    function updatePreview() {
      const preview = document.getElementById("preview");
      const hexText = document.getElementById("hexText");
      const rawText = document.getElementById("text").value.trim();

      const displayText = rawText.substring(0, 2) || "Ab";
      const colorValue = document.getElementById("color").value;

      preview.textContent = displayText; 
      preview.style.backgroundColor = colorValue;
      hexText.value = colorValue.toUpperCase();
    }

    document.getElementById("text").addEventListener("input", updatePreview);
    document.getElementById("color").addEventListener("input", updatePreview);

    document.getElementById("download").addEventListener("click", () => {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");

      // We use the FULL text for the filename
      const fullFilename = document.getElementById("text").value.trim() || "icon";
      
      // We use only the first 2 letters for the icon draw
      const displayText = fullFilename.substring(0, 2) === "icon" ? "Ab" : fullFilename.substring(0, 2);

      // Background
      ctx.fillStyle = document.getElementById("color").value;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Text setup
      ctx.fillStyle = "white";
      let fontSize = canvas.width * 0.52;
      ctx.font = `500 ${fontSize}px var(--font-main)`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // Scaling logic for the 2-letter text
      let metrics = ctx.measureText(displayText);
      while (metrics.width > canvas.width * 0.82) {
        fontSize -= 2;
        ctx.font = `500 ${fontSize}px var(--font-main)`;
        metrics = ctx.measureText(displayText);
      }

      ctx.fillText(displayText, canvas.width / 2, canvas.height / 2 + 3);

      // Exporting with the full name
      const link = document.createElement("a");
      link.download = fullFilename + ".png"; 
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    updatePreview();
  </script>

</body>
</html>
