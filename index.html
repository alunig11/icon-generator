<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Generator | v1.0</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1c1e21;
      padding: 15px;
    }

    .tool-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      width: 100%;
      max-width: 450px;
    }

    .section-title {
      font-weight: 700;
      color: #003087;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-label {
      font-weight: 600;
      color: #6c757d;
      font-size: 0.75rem;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-control {
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #ced4da;
      font-size: 0.95rem;
    }

    /* Icon Preview Container - similar to your peso-display */
    .icon-preview-box {
      background-color: #f0f7ff;
      border: 1px solid #cfe2ff;
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      border-style: dashed;
    }

    #preview {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .btn-primary {
      background-color: #0070ba;
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background-color: #003087;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .color-input-wrapper {
      width: 45px;
      height: 45px;
      padding: 0;
      border: none;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
    }

    #color {
      border: none;
      width: 150%;
      height: 150%;
      margin: -25%;
      cursor: pointer;
    }

    .input-group-text {
      background-color: #f8f9fa;
      border-color: #ced4da;
      color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="tool-card">
    <h4 class="section-title"><i class="fa-solid fa-shapes me-2"></i> Icon Generator</h4>
    
    <div class="mb-4">
      <label class="form-label">Reference Name</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa-solid fa-font"></i></span>
        <input type="text" id="text" class="form-control" placeholder="e.g. Uber, Zus" maxlength="15">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Brand Color</label>
      <div class="d-flex align-items: center; gap: 10px;">
        <div class="color-input-wrapper shadow-sm border">
          <input type="color" id="color" value="#0070ba">
        </div>
        <input type="text" id="hexText" class="form-control" value="#0070ba" readonly style="background: #f8f9fa;">
      </div>
    </div>
    
    <div class="mb-4">
      <label class="form-label">Asset Preview</label>
      <div class="icon-preview-box">
        <div id="preview">Ab</div>
        <div class="text-muted small mt-3">128x128 Logic Output</div>
      </div>
    </div>

    <button id="download" class="btn btn-primary w-100">
      <i class="fa-solid fa-download me-2"></i> Download Asset
    </button>
  </div>

  <script>
    function updatePreview() {
      const preview = document.getElementById("preview");
      const hexText = document.getElementById("hexText");
      const fullText = document.getElementById("text").value.trim();
      
      // Grabs first two letters
      const displayText = fullText.substring(0, 2) || "Ab";
      const colorValue = document.getElementById("color").value;

      preview.textContent = displayText; 
      preview.style.backgroundColor = colorValue;
      hexText.value = colorValue.toUpperCase();
    }

    document.getElementById("text").addEventListener("input", updatePreview);
    document.getElementById("color").addEventListener("input", updatePreview);

    document.getElementById("download").addEventListener("click", () => {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");

      const fullText = document.getElementById("text").value.trim() || "icon";
      const displayText = fullText.substring(0, 2).toUpperCase();

      // Background
      ctx.fillStyle = document.getElementById("color").value;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Text
      ctx.fillStyle = "white";
      let fontSize = canvas.width * 0.5;
      // Using System font stack if Jakarta isn't loaded in canvas
      ctx.font = `bold ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(displayText, canvas.width / 2, canvas.height / 2 + 2);

      // Download
      const link = document.createElement("a");
      link.download = fullText.toLowerCase().replace(/\s+/g, '-') + "-icon.png"; 
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    // Initialize
    updatePreview();
  </script>

</body>
</html>
